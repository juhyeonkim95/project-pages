<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KakaoTalk – Redesigned (Chats-first)</title>
  <style>
  :root{
    --bg:#111217; --panel:#181a20; --panel-2:#1e2129; --text:#e9ecf1; --muted:#aab0bb;
    --brand:#fee500; --accent:#5b8cff; --danger:#ff6363; --ad:#0f1117; --line:#2a2e38;
    --tabs-h:44px; --composer-h:52px; --topbar-h:44px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .app{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;height:var(--topbar-h);
          background:linear-gradient(180deg,var(--panel),var(--panel-2));border-bottom:1px solid var(--line)}
  .title{font-weight:700;font-size:15px}
  .spacer{flex:1}
  .icon-btn{background:transparent;border:0;color:var(--text);padding:4px 6px;border-radius:8px}
  .icon-btn:hover{background:#ffffff14}

  /* Screens & scroll areas */
  .screen{display:none}
  .screen.active{display:block}
  .feed{flex:1;overflow:auto;background:var(--panel-2);padding-bottom:calc(var(--tabs-h) + 8px)}
  #screen-friendlist .list,
  #screen-chats .list{padding:8px; padding-bottom:calc(var(--tabs-h) + 8px)}

  /* Stories (only on Updates) */
  .stories{display:flex;gap:8px;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);background:var(--panel)}
  .story{flex:0 0 auto;width:56px;text-align:center}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#444,#666);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:2px solid #00000033;font-size:11px}
  .story small{display:block;margin-top:4px;color:var(--muted);font-size:10px}

  /* Cards (updates feed) */
  .card{background:var(--panel);margin:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card-h{display:flex;gap:8px;align-items:center;padding:10px}
  .card-h .avatar{width:34px;height:34px;font-size:10px}
  .name{font-weight:600}
  .meta{color:var(--muted);font-size:11px}
  .chip{margin-left:6px;font-size:10px;padding:2px 6px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff22}
  .actions{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line)}
  .pill{padding:6px 8px;border-radius:9px;background:#ffffff12;color:#dfe5f2;border:1px solid #ffffff18;font-size:12px}
  .pill:hover{background:#ffffff1d}

  /* Feed images: full width, auto height (no crop) */
  .img{position:relative; padding:0; background:none; height:auto; overflow:hidden}
  .img img{width:100%; height:auto; display:block; object-fit:contain}

  /* Promoted rail */
  .promoted{background:var(--ad)}
  .promoted .badge{font-size:10px;color:#111;background:#ffda79;padding:2px 6px;border-radius:999px;margin-right:auto}
  .promoted .card-h{background:#0e131b}

  /* Lists (friends & chats) */
  .list{padding:8px}
  .row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
  .row .avatar{width:32px;height:32px;border-radius:50%;font-size:10px}
  .row .sub{color:var(--muted);font-size:11px}

  /* Tabs: fixed at bottom */
  .tabs{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:0; width:100%; max-width:420px; height:var(--tabs-h);
    display:flex; align-items:center; justify-content:space-around;
    border-top:1px solid var(--line); background:var(--panel); z-index:30;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:12px}
  .tab.active{color:var(--text)}
  .tab.disabled{pointer-events:none;opacity:.45;cursor:not-allowed}

  /* Friends header (no back button) */
  .friends-head{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  .friends-head .title{font-weight:700;font-size:14px}

  /* Sort + filter bar (Friends) */
  .sortbar{position:sticky;top:calc(var(--topbar-h));z-index:11;display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sortbtn{background:#ffffff12;border:1px solid #ffffff22;color:var(--text);padding:5px 8px;border-radius:8px;font-size:12px}
  .sortbtn.active{background:#ffffff22}
  .filter{flex:1;min-width:120px}
  .filter input{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#0f1117;color:var(--text);font-size:12px}

  /* Chat room with fixed composer */
  .chatroom{display:flex;flex-direction:column;height:calc(100vh - var(--topbar-h));background:var(--panel-2)}
  .chatlog{flex:1;overflow:auto;padding:10px; padding-bottom:calc(var(--composer-h) + var(--tabs-h) + 10px)}
  .bubble{max-width:70%;margin:6px 0;padding:6px 9px;border-radius:12px;line-height:1.35;font-size:13px}
  .me{margin-left:auto;background:#3a4b82;color:#fff}
  .them{margin-right:auto;background:#2a2e38;color:#e8ecf3}
  .composer{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:var(--tabs-h); width:100%; max-width:420px; height:var(--composer-h);
    display:flex; gap:6px; align-items:center; padding:8px 8px;
    border-top:1px solid var(--line); background:var(--panel); z-index:25;
  }
  .composer input{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#0f1117;color:#e9ecf1;font-size:13px}
  .composer button{padding:8px 12px;border:0;border-radius:10px;background:#brand;color:#111;font-weight:700;font-size:13px}
  .composer button{background:var(--brand)}

  /* Splash */
  .splash{position:fixed;inset:0;background:#fee500;display:flex;align-items:center;justify-content:center;z-index:9999}
  .splash .bubbleLogo{background:#3b2b2b;color:#fee500;padding:16px 28px;border-radius:20px;font-weight:900;letter-spacing:.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:18px}

  .hidden{display:none !important}
  </style>
</head>
<body>
  <!-- Splash (1s) -->
  <div id="splash" class="splash"><div class="bubbleLogo">TALK</div></div>

  <div class="app">
    <!-- Top bar -->
    <div class="topbar">
      <div class="title" id="topTitle">Chats</div>
      <div class="spacer"></div>
      <button class="icon-btn" aria-label="Search">🔍</button>
      <button class="icon-btn" aria-label="Settings">⚙️</button>
    </div>

    <!-- CHATS (default) -->
    <section class="screen active" id="screen-chats">
      <div class="list" id="chatList"><!-- injected --></div>
    </section>

    <!-- UPDATES (feed shows only CLOSE friends) -->
    <main class="feed screen" id="screen-updates">
      <div class="stories" id="stories">
        <div class="story"><div class="avatar">You</div><small>My Story</small></div>
        <div class="story"><div class="avatar">OL</div><small>Olivia</small></div>
        <div class="story"><div class="avatar">BO</div><small>Bob</small></div>
        <div class="story"><div class="avatar">EM</div><small>Emma</small></div>
      </div>
      <!-- Close friends posts injected here -->
      <div id="updatesMount"></div>
      <!-- Promoted rail (separate) -->
      <article class="card promoted" role="region" aria-label="Promoted content">
        <header class="card-h">
          <span class="badge">Ad</span>
          <div class="spacer"></div>
          <div class="name">K-Shop Plus</div>
        </header>
        <div class="img">
          <img src="images/ad.jpg" alt="Promoted: monitor sale" loading="lazy">
        </div>
        <div class="actions">
          <button class="pill">Why am I seeing this?</button>
          <button class="pill">Hide ad</button>
        </div>
      </article>
    </main>

    <!-- FRIENDS (FULL LIST) -->
    <section class="screen" id="screen-friendlist">
      <div class="friends-head">
        <!-- No back button here -->
        <div class="title">Friends • <span id="friendsCount">0</span></div>
      </div>
      <div class="sortbar">
        <div class="filter"><input id="friendFilter" placeholder="Filter friends…" /></div>
        <button id="catAll" class="sortbtn active" data-cat="all">All</button>
        <button id="catClose" class="sortbtn" data-cat="close">Close</button>
        <button id="catBiz" class="sortbtn" data-cat="business">Business</button>
        <button id="sortRecent" class="sortbtn active">Recent</button>
        <button id="sortAZ" class="sortbtn">A–Z</button>
      </div>
      <div class="list" id="friendList"><!-- injected --></div>
    </section>

    <!-- CHAT ROOM -->
    <section class="screen" id="screen-chatroom">
      <div class="friends-head">
        <button id="backToChatList" class="back" aria-label="Back to chats">◀</button>
        <div class="title" id="chatWith">Chat</div>
      </div>
      <div class="chatroom">
        <div id="chatLog" class="chatlog"></div>
        <div class="composer">
          <input id="chatInput" placeholder="Message…" />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </section>

    <!-- Bottom tabs -->
    <nav class="tabs" id="bottomTabs">
      <a class="tab active" data-screen="chats">Chats</a>
      <a class="tab" data-screen="friendlist">Friends</a>
      <a class="tab" data-screen="updates">Updates</a>
      <a class="tab disabled" aria-disabled="true">Now</a>
      <a class="tab disabled" aria-disabled="true">Search</a>
      <a class="tab disabled" aria-disabled="true">More</a>
    </nav>
  </div>

  <script>
    // --- Router ---
    const screens = {
      chats: document.getElementById('screen-chats'),
      updates: document.getElementById('screen-updates'),
      friendlist: document.getElementById('screen-friendlist'),
      chatroom: document.getElementById('screen-chatroom'),
    };
    const tabs = document.querySelectorAll('#bottomTabs .tab');
    const topTitle = document.getElementById('topTitle');

    function setScreen(name){
      Object.values(screens).forEach(el=> el.classList.remove('active'));
      if (screens[name]) screens[name].classList.add('active');
      tabs.forEach(t=> t.classList.toggle('active', t.dataset.screen===name));
      topTitle.textContent = name[0].toUpperCase()+name.slice(1);
      if (screens[name]) screens[name].scrollTop = 0;
    }
    tabs.forEach(t=> t.addEventListener('click', (e)=>{
      if(!t.dataset.screen) return; // disabled tabs have no dataset
      e.preventDefault(); setScreen(t.dataset.screen);
    }));

    // Splash hide after 1s
    setTimeout(()=>{ const s=document.getElementById('splash'); if(s) s.classList.add('hidden'); }, 1000);

    // --- Friend data with categories ---
    const names = [
      "Olivia Smith","Liam Johnson","Emma Brown","Noah Davis","Ava Miller","Sophia Wilson","Isabella Moore","Mia Taylor","Charlotte Anderson","Amelia Thomas",
      "Harper Jackson","Evelyn White","Abigail Harris","Emily Martin","Ella Thompson","Avery Garcia","Scarlett Martinez","Grace Robinson","Chloe Clark","Lily Rodriguez",
      "Aria Lewis","Zoey Lee","Hannah Walker","Nora Hall","Riley Allen","Layla Young","Lillian Hernandez","Addison King","Eleanor Wright","Lucy Lopez",
      "Paisley Hill","Violet Scott","Penelope Green","Aurora Adams","Savannah Baker","Stella Gonzalez","Hazel Nelson","Mila Carter","Nova Mitchell","Ellie Perez",
      "James Turner","Benjamin Phillips","Elijah Campbell","Lucas Parker","Alexander Evans","Henry Edwards","Michael Collins","Daniel Stewart","Matthew Sanchez","Jackson Morris",
      "Sebastian Rogers","Jack Reed"
    ];
    const CLOSE = new Set(["Olivia Smith","Emma Brown","Sophia Wilson","Mia Taylor","James Turner","Elijah Campbell","Ellie Perez"]);
    const BUSINESS = new Set(["Liam Johnson","Noah Davis","Ava Miller","Charlotte Anderson","Amelia Thomas","Lucas Parker","Alexander Evans","Michael Collins","Daniel Stewart", "Layla Young"]);

    function categoryOf(name){
      if (CLOSE.has(name)) return "close";
      if (BUSINESS.has(name)) return "business";
      return "other";
    }
    const friendData = names.map(n => ({
      name:n,
      category: categoryOf(n),
      updated: Date.now() - Math.floor(Math.random()*7*24*60)*60*1000
    }));

    // Update visible total friend count
    const friendsCountEl = document.getElementById('friendsCount');
    if (friendsCountEl) friendsCountEl.textContent = String(friendData.length);

    // Chats state + seed a few conversations so it's not empty
    const conversations = new Map();
    [
      { name:"Alice Kim", msgs:[{me:false,text:"Hey, are we still on for tomorrow?"},{me:true,text:"Yep! 10am at the café."}] },
      { name:"Bob Lee",   msgs:[{me:true,text:"Can you send the slides?"},{me:false,text:"Just emailed you 👍"}] },
      { name:"Team – YOLO Capital", msgs:[{me:false,text:"Reminder: design sync moved to 2pm."}] }
    ].forEach(c=> conversations.set(c.name, c));

    function humanize(ts){
      const mins = Math.round((Date.now()-ts)/60000);
      if(mins<60) return `${mins}m ago`;
      const hrs = Math.round(mins/60); if(hrs<24) return `${hrs}h ago`;
      const d = Math.round(hrs/24); return `${d}d ago`;
    }

    // --- FRIENDS LIST: filter + category + sort ---
    let currentMode = 'recent';   // 'recent' | 'az'
    let currentCat  = 'all';      // 'all' | 'close' | 'business'
    const friendList   = document.getElementById('friendList');
    const friendFilter = document.getElementById('friendFilter');

    function renderFriendList(){
      let list = [...friendData];

      if (currentCat !== 'all') list = list.filter(x => x.category === currentCat);

      const q = (friendFilter?.value || '').toLowerCase();
      if (q) list = list.filter(x => x.name.toLowerCase().includes(q));

      if (currentMode === 'az') list.sort((a,b)=> a.name.localeCompare(b.name));
      else list.sort((a,b)=> b.updated - a.updated);

      friendList.innerHTML = list.map(x=>`
        <div class="row friend-item" data-name="${x.name}">
          <div class="avatar">${x.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
          <div>
            <div class="name">${x.name}</div>
            <div class="sub">${x.category === 'close' ? 'Close friend' : x.category === 'business' ? 'Business contact' : 'Friend'} • Updated ${humanize(x.updated)}</div>
          </div>
        </div>`).join('');

      friendList.querySelectorAll('.friend-item').forEach(el=>{
        el.addEventListener('dblclick', ()=> openChat(el.dataset.name));
      });
    }

    document.getElementById('sortAZ').addEventListener('click', ()=>{
      currentMode='az';
      document.getElementById('sortAZ').classList.add('active');
      document.getElementById('sortRecent').classList.remove('active');
      renderFriendList();
    });
    document.getElementById('sortRecent').addEventListener('click', ()=>{
      currentMode='recent';
      document.getElementById('sortRecent').classList.add('active');
      document.getElementById('sortAZ').classList.remove('active');
      renderFriendList();
    });

    function setCat(cat){
      currentCat = cat;
      document.getElementById('catAll').classList.toggle('active', cat==='all');
      document.getElementById('catClose').classList.toggle('active', cat==='close');
      document.getElementById('catBiz').classList.toggle('active', cat==='business');
      renderFriendList();
    }
    document.getElementById('catAll').addEventListener('click', ()=> setCat('all'));
    document.getElementById('catClose').addEventListener('click', ()=> setCat('close'));
    document.getElementById('catBiz').addEventListener('click', ()=> setCat('business'));

    friendFilter.addEventListener('input', renderFriendList);

    // --- CHATS LIST ---
    const chatList = document.getElementById('chatList');
    function renderChats(){
      const rows = Array.from(conversations.values()).map(c=>`
        <div class="row chat-row" data-name="${c.name}">
          <div class="avatar">${c.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
          <div>
            <div class="name">${c.name}</div>
            <div class="sub">${(c.msgs[c.msgs.length-1]||{text:''}).text || 'New chat'}</div>
          </div>
        </div>`).join('');
      chatList.innerHTML = rows || '<div class="row"><div class="sub">No chats yet. Double-click a friend to start one (Friends tab).</div></div>';
      chatList.querySelectorAll('.chat-row').forEach(el=> el.addEventListener('click', ()=> openChat(el.dataset.name)) );
    }

    // --- UPDATES FEED: only CLOSE friends posts ---
    const imagesByName = {
	"Olivia Smith":"images/cat.jpg",
    };
    const posts = friendData
      .filter(f => f.category === 'close')
      .slice(0, 3)
      .map(f => ({
        author: f.name,
        time: humanize(f.updated),
        audience: "Close Friends",
        img: imagesByName[f.name] || "https://picsum.photos/800/500?random=" + encodeURIComponent(f.name),
      }));

    function renderUpdates(){
      const mount = document.getElementById('updatesMount');
      if(!mount) return;
      mount.innerHTML = posts.map(p => `
        <article class="card">
          <header class="card-h">
            <div class="avatar">${p.author.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
            <div>
              <div class="name">${p.author}</div>
              <div class="meta">${p.time} • Friends <span class="chip">${p.audience}</span></div>
            </div>
            <div class="spacer"></div>
            <button class="icon-btn">⋯</button>
          </header>
          <div class="img">
            <img src="${p.img}" alt="Post by ${p.author}" loading="lazy">
          </div>
          <div class="actions">
            <button class="pill">👍 Like</button>
            <button class="pill">💬 Comment</button>
          </div>
        </article>
      `).join('');
    }

    // --- CHAT ROOM ---
    const chatLog  = document.getElementById('chatLog');
    const chatWith = document.getElementById('chatWith');
    const chatInput= document.getElementById('chatInput');

    function openChat(name){
      if(!conversations.has(name)) conversations.set(name,{name, msgs:[]});
      const convo = conversations.get(name);
      chatWith.textContent = name;
      renderChatLog(convo);
      setScreen('chatroom');
    }

    function renderChatLog(convo){
      chatLog.innerHTML = convo.msgs.map(m=>`<div class="bubble ${m.me?'me':'them'}">${m.text}</div>`).join('');
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // Send message
    document.getElementById('sendBtn').addEventListener('click', send);
    chatInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); }});
    function send(){
      const name = chatWith.textContent;
      const text = chatInput.value.trim(); if(!text) return;
      const convo = conversations.get(name); if(!convo) return;
      convo.msgs.push({me:true,text});
      chatInput.value='';
      renderChatLog(convo);
      renderChats();
      setScreen('chatroom'); // keep focus
    }

    // Back from chat room to Chats
    document.getElementById('backToChatList').addEventListener('click', ()=> setScreen('chats'));

    // Initial renders
    renderFriendList();
    renderChats();
    renderUpdates();

    // Start on CHATS after splash
    setScreen('chats');
  </script>
</body>
</html>
